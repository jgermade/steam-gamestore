name: Build

# Every push, on every branch. A pull request from a branch in this repository is
# already covered by the push that created it, and adding a `pull_request` trigger
# only skipped duplicate jobs onto the PR — the checks a reviewer sees come from the
# push. If an outside fork ever contributes, add `pull_request` back deliberately.
#
# It is also callable: `release.yml` runs this against the tag it has just created,
# so what ships is what these checks passed on, not a separate build nobody tested.
on:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build. Defaults to whatever triggered the run.
        type: string
        required: false
        default: ""
      package:
        description: Also build the release binaries and upload them as artifacts.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # The ref is part of the group so a release build is never cancelled by an
  # ordinary push landing while it runs.
  group: build-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --workspace --target ${{ matrix.target }}

  package:
    name: package ${{ matrix.name }}
    # Only for a release: an ordinary push has no use for the artifacts, and
    # building them again at `--release` doubles the time of every branch build.
    if: inputs.package
    needs: [fmt, check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: gamestore
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: gamestore.exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
      - run: cargo build --release --locked -p gamestore-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: gamestore-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
