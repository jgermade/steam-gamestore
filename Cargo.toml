[workspace]
members = ["core", "platform-linux", "platform-windows", "cli", "ui"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/jgermade/steam-gamestore"

[workspace.dependencies]
gamestore-core = { path = "core" }
gamestore-platform-linux = { path = "platform-linux" }
gamestore-platform-windows = { path = "platform-windows" }
gamestore-ui = { path = "ui" }

clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
gilrs = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "4"
md-5 = "0.10"
sha2 = "0.10"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
ureq = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
